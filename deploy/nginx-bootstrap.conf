# Temporary HTTP entry while the requested DNS name is not yet supplied.
# The named HTTPS configuration is installed by configure_nginx.py.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tiktoklive-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8765;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        access_log off;
    }
    location / { return 404; }
}
