[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TikTokLive"
version = "6.6.5"
description = "TikTok Live Python Client"
readme = "README.md"  # Corrected format
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Isaac Kogan", email = "info@isaackogan.com" }
]
keywords = ["tiktok", "tiktok live", "python3", "api", "unofficial"]
dependencies = [
    "httpx>=0.26.0,<0.29",
    "pyee>=9.0.4,<14",
    "ffmpy>=0.3.0",
    "websockets_proxy==0.1.3",
    "websockets>=13,<14",
    "betterproto==2.0.0b7",
    "async-timeout>=4.0.3",
    "mashumaro>=3.5",
    "protobuf3-to-dict>=0.1.5",
    "protobuf>=3.19.4"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

[project.optional-dependencies]
interactive = [
    "curl_cffi==0.13.0"
]
server = [
    "curl_cffi==0.13.0",
    "fastapi>=0.110,<1",
    "uvicorn>=0.22,<1",
    "redis>=5,<6",
    "pydantic>=2,<3",
]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/isaackogan/TikTokLive"

[tool.setuptools]
license-files = ['LICENSE']

[tool.setuptools.packages.find]
where = ["."]
include = ["TikTokLive*", "live_service*", "examples*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst", "*.md"]  # Proper wildcard for including package data

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning", "error::ResourceWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["TikTokLive/proto/tiktok_proto.py", "scripts/docs", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
